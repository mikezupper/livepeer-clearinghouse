{
  "components": {
    "schemas": {
      "CredentialRequest": {
        "additionalProperties": false,
        "properties": {
          "name": {
            "maxLength": 80,
            "minLength": 1,
            "title": "Name",
            "type": "string"
          }
        },
        "required": [
          "name"
        ],
        "title": "CredentialRequest",
        "type": "object"
      },
      "EmailRequest": {
        "additionalProperties": false,
        "properties": {
          "email": {
            "maxLength": 320,
            "minLength": 3,
            "title": "Email",
            "type": "string"
          }
        },
        "required": [
          "email"
        ],
        "title": "EmailRequest",
        "type": "object"
      },
      "EmailVerification": {
        "additionalProperties": false,
        "properties": {
          "code": {
            "pattern": "^[0-9]{6}$",
            "title": "Code",
            "type": "string"
          },
          "email": {
            "maxLength": 320,
            "minLength": 3,
            "title": "Email",
            "type": "string"
          }
        },
        "required": [
          "email",
          "code"
        ],
        "title": "EmailVerification",
        "type": "object"
      },
      "GoRequest": {
        "additionalProperties": false,
        "properties": {
          "headers": {
            "additionalProperties": {
              "items": {
                "type": "string"
              },
              "type": "array"
            },
            "title": "Headers",
            "type": "object"
          },
          "state": {
            "$ref": "#/components/schemas/GoState"
          }
        },
        "required": [
          "headers",
          "state"
        ],
        "title": "GoRequest",
        "type": "object"
      },
      "GoState": {
        "properties": {
          "App": {
            "default": "",
            "maxLength": 256,
            "title": "App",
            "type": "string"
          },
          "AuthID": {
            "default": "",
            "title": "Authid",
            "type": "string"
          },
          "InitialPixelsPerUnit": {
            "exclusiveMinimum": 0.0,
            "title": "Initialpixelsperunit",
            "type": "integer"
          },
          "InitialPricePerUnit": {
            "minimum": 0.0,
            "title": "Initialpriceperunit",
            "type": "integer"
          },
          "OrchestratorAddress": {
            "title": "Orchestratoraddress",
            "type": "string"
          },
          "PMSessionID": {
            "default": "",
            "title": "Pmsessionid",
            "type": "string"
          },
          "SequenceNumber": {
            "minimum": 0.0,
            "title": "Sequencenumber",
            "type": "integer"
          },
          "StateID": {
            "maxLength": 256,
            "minLength": 1,
            "title": "Stateid",
            "type": "string"
          },
          "Type": {
            "default": "",
            "maxLength": 32,
            "title": "Type",
            "type": "string"
          }
        },
        "required": [
          "StateID",
          "OrchestratorAddress",
          "InitialPricePerUnit",
          "InitialPixelsPerUnit",
          "SequenceNumber"
        ],
        "title": "GoState",
        "type": "object"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "title": "Detail",
            "type": "array"
          }
        },
        "title": "HTTPValidationError",
        "type": "object"
      },
      "StopRequest": {
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "title": "Enabled",
            "type": "boolean"
          },
          "reason": {
            "maxLength": 500,
            "minLength": 1,
            "title": "Reason",
            "type": "string"
          }
        },
        "required": [
          "enabled",
          "reason"
        ],
        "title": "StopRequest",
        "type": "object"
      },
      "ValidationError": {
        "properties": {
          "ctx": {
            "title": "Context",
            "type": "object"
          },
          "input": {
            "title": "Input"
          },
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "title": "Location",
            "type": "array"
          },
          "msg": {
            "title": "Message",
            "type": "string"
          },
          "type": {
            "title": "Error Type",
            "type": "string"
          }
        },
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError",
        "type": "object"
      },
      "WorkloadRequest": {
        "additionalProperties": false,
        "properties": {
          "client_reference": {
            "anyOf": [
              {
                "maxLength": 256,
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Client Reference"
          },
          "offer_id": {
            "maxLength": 128,
            "minLength": 1,
            "title": "Offer Id",
            "type": "string"
          },
          "ttl_seconds": {
            "default": 3600,
            "maximum": 86400.0,
            "minimum": 60.0,
            "title": "Ttl Seconds",
            "type": "integer"
          }
        },
        "required": [
          "offer_id"
        ],
        "title": "WorkloadRequest",
        "type": "object"
      }
    }
  },
