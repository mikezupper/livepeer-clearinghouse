services:
  fake-resend:
    image: ${CLEARINGHOUSE_BACKEND_IMAGE:-livepeer/clearinghouse-backend:local}
    user: "0:0"
    entrypoint: ["python", "/app/deploy/qualification/fake_resend.py"]
    environment:
      QUALIFICATION_RESEND_KEY_FILE: /run/secrets/resend-api-key
      QUALIFICATION_MAILBOX_TOKEN_FILE: /run/secrets/qualification-mailbox-token
    secrets:
      - resend-api-key
      - qualification-mailbox-token
    ports:
      - 127.0.0.1:${QUALIFICATION_RESEND_PORT:?set QUALIFICATION_RESEND_PORT}:8081
    networks:
      - egress
      - qualification-public
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add: ["DAC_OVERRIDE", "SETGID", "SETUID"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"

  api:
    environment:
      CLEARINGHOUSE_AUTH_RESEND_API_URL: http://fake-resend:8081
    depends_on:
      fake-resend:
        condition: service_healthy

  edge:
    networks:
      - app
      - qualification-public

networks:
  qualification-public: {}

secrets:
  qualification-mailbox-token:
    file: ${QUALIFICATION_MAILBOX_TOKEN_HOST_FILE:?set QUALIFICATION_MAILBOX_TOKEN_HOST_FILE}
