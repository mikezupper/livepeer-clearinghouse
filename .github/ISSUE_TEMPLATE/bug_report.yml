name: Bug report
description: Report a reproducible defect in the unmodified clearinghouse.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include secrets or security-sensitive details. Report vulnerabilities through [GitHub private vulnerability reporting](https://github.com/livepeer/clearinghouse/security/advisories/new).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API
        - Metering consumer
        - Admin web application
        - User web application
        - Remote-signer integration
        - PostgreSQL or migrations
        - Redpanda or event contracts
        - Docker Compose or operations
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image digest, or commit SHA.
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including sanitized error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact commands or requests against the unmodified reference distribution.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Docker/Compose versions, browser, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Logs or evidence with credentials, keys, OTPs, personal data, and production identifiers removed.
  - type: checkboxes
    id: conduct
    attributes:
      label: Community agreement
      options:
        - label: I will follow the repository Code of Conduct and have removed sensitive data.
          required: true
