name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable SemVer tag to publish (for example v1.2.3)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.guard.outputs.revision }}
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical immutable release tag
        id: guard
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: >-
          python3 scripts/release_guard.py
          --repository "$GITHUB_REPOSITORY"
          --event "$GITHUB_EVENT_NAME"
          --trigger-ref "$GITHUB_REF"
          --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"
      - name: Validate supply-chain workflow policy
        run: python3 scripts/validate_supply_chain.py

  build:
    name: build and qualify (${{ matrix.component }})
    needs: [validate, qualify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/livepeer/clearinghouse-backend
            dockerfile: deploy/backend.Dockerfile
            build_args: ""
          - component: admin-web
            image: ghcr.io/livepeer/clearinghouse-admin-web
            dockerfile: deploy/frontend.Dockerfile
            build_args: APP=admin-web
          - component: user-web
            image: ghcr.io/livepeer/clearinghouse-user-web
            dockerfile: deploy/frontend.Dockerfile
            build_args: APP=user-web
          - component: edge
            image: ghcr.io/livepeer/clearinghouse-edge
            dockerfile: deploy/edge.Dockerfile
            build_args: ""
          - component: ops
            image: ghcr.io/livepeer/clearinghouse-ops
            dockerfile: deploy/ops/Dockerfile
            build_args: ""
          - component: remote-signer
            image: ghcr.io/livepeer/clearinghouse-remote-signer
            dockerfile: deploy/signer/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build once and push immutable staging tag
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ matrix.image }}:sha-${{ needs.validate.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/livepeer/clearinghouse
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
      - name: Scan the exact built digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
          format: table
      - name: Prepare release metadata
        run: mkdir -p release
      - name: Generate SPDX SBOM from the qualified digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release/${{ matrix.component }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX SBOM from the qualified digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: release/${{ matrix.component }}.cyclonedx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance in GHCR
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SPDX SBOM in GHCR
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: release/${{ matrix.component }}.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Keylessly sign and verify the exact digest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
      - name: Write immutable descriptor and checksums
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.validate.outputs.revision }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          jq -n --arg component "$COMPONENT" --arg image "$IMAGE" \
            --arg digest "$DIGEST" --arg revision "$REVISION" --arg version "$VERSION" \
            '{component:$component,image:$image,digest:$digest,revision:$revision,version:$version}' \
            > "release/${COMPONENT}.image.json"
          (cd release && sha256sum "${COMPONENT}.image.json" "${COMPONENT}.spdx.json" \
            "${COMPONENT}.cyclonedx.json" > "${COMPONENT}.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.component }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked Python package manager
        run: python -m pip install --disable-pip-version-check uv==0.12.12
      - name: Install locked browser dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Qualify the exact release commit
        run: make test

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse to mutate an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; releases are immutable"
            exit 1
          fi
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Verify downloaded checksums and image descriptors
        env:
          REVISION: ${{ needs.validate.outputs.revision }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          (cd release && for checksums in *.sha256; do sha256sum --check "$checksums"; done)
          python3 scripts/verify_release_descriptors.py \
            --directory release --version "$VERSION" --revision "$REVISION"
      - name: Refuse existing immutable OCI version tags
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for descriptor in release/*.image.json; do
            image="$(jq -er .image "$descriptor")"
            if docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null 2>&1; then
              echo "::error::immutable image tag already exists: ${image}:${VERSION}"
              exit 1
            fi
          done
      - name: Promote qualified digests without rebuilding
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for descriptor in release/*.image.json; do
            image="$(jq -er .image "$descriptor")"
            digest="$(jq -er .digest "$descriptor")"
            docker buildx imagetools create --tag "${image}:${VERSION}" "${image}@${digest}"
            published="$(docker buildx imagetools inspect "${image}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
            test "$published" = "$digest"
            if [[ "$VERSION" != *-* ]]; then
              docker buildx imagetools create --tag "${image}:latest" "${image}@${digest}"
              latest="$(docker buildx imagetools inspect "${image}:latest" | awk '/^Digest:/ {print $2; exit}')"
              test "$latest" = "$digest"
            fi
          done
      - name: Build deterministic contracts bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct HEAD)"
          python3 scripts/release_assets.py --version "$VERSION" \
            --output-directory release --source-date-epoch "$epoch"
      - name: Create release checksums
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z > release-files.list
          (cd release && xargs -0 sha256sum < ../release-files.list) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp release/SHA256SUMS
          rm release-files.list
          (cd release && sha256sum --check SHA256SUMS)
      - name: Attest release asset provenance
        id: release-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Include provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.release-provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/release-assets.provenance.sigstore.json
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease+=(--prerelease)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Open Clearinghouse $TAG" --verify-tag --generate-notes "${prerelease[@]}"
