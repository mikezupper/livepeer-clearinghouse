name: ${COMPOSE_PROJECT_NAME:-livepeer-clearinghouse}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks: [core]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  core:
    image: ${CLEARINGHOUSE_CORE_IMAGE:-livepeer/clearinghouse-core:local}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      CLEARINGHOUSE_ENVIRONMENT: ${CLEARINGHOUSE_ENVIRONMENT:-development}
      CLEARINGHOUSE_LOG_LEVEL: ${CLEARINGHOUSE_LOG_LEVEL:-INFO}
      CLEARINGHOUSE_DATABASE_PATH: /data/clearinghouse.db
      CLEARINGHOUSE_DATABASE_BUSY_TIMEOUT_MS: ${CLEARINGHOUSE_DATABASE_BUSY_TIMEOUT_MS:-5000}
      CLEARINGHOUSE_HTTP_HOST: 0.0.0.0
      CLEARINGHOUSE_HTTP_PORT: 8000
      CLEARINGHOUSE_PUBLIC_URL: ${CLEARINGHOUSE_PUBLIC_URL:-http://localhost:8080}
      CLEARINGHOUSE_ALLOWED_ORIGINS: ${CLEARINGHOUSE_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CLEARINGHOUSE_COOKIE_SECURE: ${CLEARINGHOUSE_COOKIE_SECURE:-false}
      CLEARINGHOUSE_ADMIN_EMAIL: ${CLEARINGHOUSE_ADMIN_EMAIL:-}
      CLEARINGHOUSE_AUTH_PEPPER: ${CLEARINGHOUSE_AUTH_PEPPER:?set CLEARINGHOUSE_AUTH_PEPPER}
      CLEARINGHOUSE_WORKLOAD_PEPPER: ${CLEARINGHOUSE_WORKLOAD_PEPPER:?set CLEARINGHOUSE_WORKLOAD_PEPPER}
      CLEARINGHOUSE_AUTH_RESEND_API_URL: ${CLEARINGHOUSE_AUTH_RESEND_API_URL:-https://api.resend.com}
      CLEARINGHOUSE_AUTH_RESEND_API_KEY: ${CLEARINGHOUSE_AUTH_RESEND_API_KEY:?set CLEARINGHOUSE_AUTH_RESEND_API_KEY}
      CLEARINGHOUSE_AUTH_RESEND_FROM: ${CLEARINGHOUSE_AUTH_RESEND_FROM:?set CLEARINGHOUSE_AUTH_RESEND_FROM}
      CLEARINGHOUSE_AUTH_GOOGLE_ENABLED: ${CLEARINGHOUSE_AUTH_GOOGLE_ENABLED:-false}
      CLEARINGHOUSE_AUTH_GOOGLE_CLIENT_ID: ${CLEARINGHOUSE_AUTH_GOOGLE_CLIENT_ID:-}
      CLEARINGHOUSE_AUTH_GOOGLE_CLIENT_SECRET: ${CLEARINGHOUSE_AUTH_GOOGLE_CLIENT_SECRET:-}
      CLEARINGHOUSE_AUTH_GITHUB_ENABLED: ${CLEARINGHOUSE_AUTH_GITHUB_ENABLED:-false}
      CLEARINGHOUSE_AUTH_GITHUB_CLIENT_ID: ${CLEARINGHOUSE_AUTH_GITHUB_CLIENT_ID:-}
      CLEARINGHOUSE_AUTH_GITHUB_CLIENT_SECRET: ${CLEARINGHOUSE_AUTH_GITHUB_CLIENT_SECRET:-}
      CLEARINGHOUSE_SIGNER_ID: ${CLEARINGHOUSE_SIGNER_ID:-signer_default0000}
      CLEARINGHOUSE_SIGNER_WEBHOOK_SECRET: ${CLEARINGHOUSE_SIGNER_WEBHOOK_SECRET:?set CLEARINGHOUSE_SIGNER_WEBHOOK_SECRET}
      CLEARINGHOUSE_DISCOVERY_URLS: ${CLEARINGHOUSE_DISCOVERY_URLS:-http://remote-signer:8935/discover-orchestrators}
      CLEARINGHOUSE_LV2V_OFFERS_FILE: ${CLEARINGHOUSE_LV2V_OFFERS_FILE:-}
      CLEARINGHOUSE_DISCOVERY_TTL_SECONDS: ${CLEARINGHOUSE_DISCOVERY_TTL_SECONDS:-3600}
      CLEARINGHOUSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      CLEARINGHOUSE_KAFKA_METERING_TOPIC: ${CLEARINGHOUSE_KAFKA_METERING_TOPIC:-livepeer-gateway-events}
      CLEARINGHOUSE_KAFKA_METERING_GROUP_ID: ${CLEARINGHOUSE_KAFKA_METERING_GROUP_ID:-clearinghouse-core-v1}
      CLEARINGHOUSE_KAFKA_RETENTION_MS: ${CLEARINGHOUSE_KAFKA_RETENTION_MS:-604800000}
    volumes:
      - sqlite-data:/data
      - ./config:/app/config:ro
    depends_on:
      redpanda:
        condition: service_healthy
    networks: [core]
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  remote-signer:
    image: ${CLEARINGHOUSE_SIGNER_IMAGE:-livepeer/clearinghouse-remote-signer:local}
    build:
      context: .
      dockerfile: deploy/signer/Dockerfile
    platform: linux/amd64
    user: "0:0"
    environment:
      CLEARINGHOUSE_SECRET_OWNER_UID: ${CLEARINGHOUSE_SECRET_OWNER_UID:-1000}
      SIGNER_MODE: ${SIGNER_MODE:-evaluation}
      SIGNER_NETWORK: ${SIGNER_NETWORK:-arbitrum-one-mainnet}
      SIGNER_CHAIN_ID: ${SIGNER_CHAIN_ID:-42161}
      SIGNER_CONTROLLER: ${SIGNER_CONTROLLER:-0xD8E8328501E9645d16Cf49539efC04f734606ee4}
      ETH_RPC_URL: ${ETH_RPC_URL:?set ETH_RPC_URL}
      SIGNER_ETH_ADDR: ${SIGNER_ETH_ADDR:?set SIGNER_ETH_ADDR}
      SIGNER_ETH_KEYSTORE_PATH: /run/secrets/signer-keystore.json
      SIGNER_PASSWORD_FILE: /run/secrets/signer-password
      SIGNER_DATA_DIR: /data
      SIGNER_PORT: 8935
      SIGNER_REMOTE_DISCOVERY: ${SIGNER_REMOTE_DISCOVERY:-true}
      SIGNER_ORCH_ADDR: ${SIGNER_ORCH_ADDR:-}
      REMOTE_SIGNER_WEBHOOK_URL: http://core:8000/v1/compat/go-livepeer/authorize
      WEBHOOK_SECRET: ${CLEARINGHOUSE_SIGNER_WEBHOOK_SECRET:?set CLEARINGHOUSE_SIGNER_WEBHOOK_SECRET}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_GATEWAY_TOPIC: ${CLEARINGHOUSE_KAFKA_METERING_TOPIC:-livepeer-gateway-events}
      LP_KAFKAUSER: ${LP_KAFKAUSER:-}
      LP_KAFKAPASSWORD: ${LP_KAFKAPASSWORD:-}
    volumes:
      - type: bind
        source: ${SIGNER_KEYSTORE_HOST_FILE:?set SIGNER_KEYSTORE_HOST_FILE}
        target: /run/secrets/signer-keystore.json
        read_only: true
      - type: bind
        source: ${SIGNER_PASSWORD_HOST_FILE:?set SIGNER_PASSWORD_HOST_FILE}
        target: /run/secrets/signer-password
        read_only: true
      - signer-data:/data
    depends_on:
      core:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks: [core]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /runtime-secrets:uid=10001,gid=10001,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETPCAP, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "setpriv", "--reuid=10001", "--regid=10001", "--clear-groups", "--inh-caps=-chown,-dac_override,-setpcap,-setgid,-setuid", "--ambient-caps=-chown,-dac_override,-setpcap,-setgid,-setuid", "--bounding-set=-chown,-dac_override,-setpcap,-setgid,-setuid", "--no-new-privs", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8935"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  edge:
    image: ${CLEARINGHOUSE_EDGE_IMAGE:-livepeer/clearinghouse-edge:local}
    build:
      context: .
      dockerfile: deploy/edge.Dockerfile
    ports:
      - 127.0.0.1:${CLEARINGHOUSE_EDGE_PORT:-8080}:8080
    depends_on:
      core:
        condition: service_healthy
    networks: [core]
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001
      - /data:uid=10001,gid=10001
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  core: {}

volumes:
  redpanda-data: {}
  signer-data: {}
  sqlite-data: {}
